[build-system]
requires = ["scikit-build-core>=0.5",
"pybind11>=2.11","setuptools>=64",]
build-backend = "scikit_build_core.build"

[project]
name = "miniserving"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = []

[tool.scikit-build]
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
cmake.args = ["-DCMAKE_CXX_STANDARD=17"]
